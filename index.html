<script>
    const GITHUB_API_URL = "https://api.github.com/repos/nhutvo2310/Navimaps/releases/tags/Navimaps_s3_240";

    fetch(GITHUB_API_URL)
        .then(response => {
            if (!response.ok) throw new Error("Không thể lấy dữ liệu từ GitHub");
            return response.json();
        })
        .then(data => {
            const apkAssets = data.assets.filter(asset =>
                asset.name.toLowerCase().endsWith(".apk")
            );

            if (apkAssets.length > 0) {
                apkAssets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                window.location.href = apkAssets[0].browser_download_url;
            } else {
                window.location.href = "https://github.com/nhutvo2310/Navimaps/releases/tag/Navimaps_s3_240";
            }
        })
        .catch(error => {
            console.error("Lỗi:", error);
            window.location.href = "https://github.com/nhutvo2310/Navimaps/releases/tag/Navimaps_s3_240";
        });
</script>
